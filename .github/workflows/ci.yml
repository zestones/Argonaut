# Minimal pull-request gate. Expensive and platform-specific checks are available in the manual
# Extended checks workflow; keeping one automatic Ubuntu job avoids consuming Actions minutes twice.
name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEFLAGS: -j4

jobs:
  gate:
    name: ubuntu · gcc · debug · tests and ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y flex bison clang-format
      - name: Unit, language, IR, documentation and regression tests
        run: make CONFIG=debug check
      - name: Formatting and debt ratchets
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: make lint
